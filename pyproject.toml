[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "botocore>=1.40.61",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pyright]
extraPaths = ["."]
